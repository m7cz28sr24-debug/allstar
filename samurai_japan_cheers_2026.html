<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>侍ジャパン 応援歌 2026</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080b12;
  --panel: #151b27;
  --panel2: #20293a;
  --text: #f7f9ff;
  --muted: #aab5c7;
  --accent: #69b7ff;
  --line: #344055;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
    "Yu Gothic", Meiryo, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
header {
  position: sticky; top: 0; z-index: 5;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px;
  background: rgba(8,11,18,.96);
  border-bottom: 1px solid var(--line);
}
.topline { display:flex; align-items:center; justify-content:space-between; gap:10px; }
h1 { margin:0; font-size:18px; letter-spacing:.03em; }
.sub { color:var(--muted); font-size:12px; margin-top:5px; }
.controls { display:flex; align-items:center; gap:8px; }
button {
  color:var(--text); background:var(--panel2); border:1px solid var(--line);
  border-radius:12px; min-height:42px; padding:8px 13px;
  font:inherit; font-weight:700; cursor:pointer;
}
button:active { transform:scale(.97); }
button:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
main { max-width:760px; margin:0 auto; padding:14px 14px calc(24px + env(safe-area-inset-bottom)); }
.player {
  background:linear-gradient(145deg, #172235, #111722);
  border:1px solid var(--line); border-radius:18px; padding:18px 16px;
  min-height:300px; display:flex; flex-direction:column;
}
.player-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.count { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
.player h2 { font-size:26px; margin:4px 0 0; }
.source { color:var(--accent); font-size:13px; text-decoration:none; white-space:nowrap; }
.lyrics {
  margin:22px 0 18px; font-size:clamp(25px, 7vw, 36px);
  line-height:1.75; font-weight:800; letter-spacing:.025em;
  overflow-wrap:anywhere; white-space:pre-line;
}
.lyrics .section { display:block; color:#8fcaff; font-size:.68em; margin:12px 0 2px; }
.lyrics .chant { display:block; color:#ffe08a; }
.nav { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:auto; }
.nav button { min-height:54px; font-size:16px; }
.nav button:disabled { opacity:.35; }
.selector-title { margin:20px 2px 10px; color:var(--muted); font-size:13px; font-weight:700; }
.roster { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.roster button { min-height:48px; text-align:left; padding:10px 12px; font-size:15px; }
.roster button.active { background:#164d79; border-color:#69b7ff; }
.footer-note { color:var(--muted); font-size:12px; line-height:1.6; margin:16px 2px 0; }
@media (min-width:600px) {
  main { padding-top:22px; }
  .roster { grid-template-columns:repeat(3, minmax(0,1fr)); }
}
</style>
</head>
<body>
<header>
  <div class="topline">
    <div>
      <h1>侍ジャパン 応援歌 2026</h1>
      <div class="sub">ライトスタンド用・歌詞表示</div>
    </div>
    <div class="controls" aria-label="文字サイズ">
      <button id="smaller" type="button" aria-label="文字を小さく">A−</button>
      <button id="larger" type="button" aria-label="文字を大きく">A＋</button>
    </div>
  </div>
</header>
<main>
  <section class="player" aria-live="polite">
    <div class="player-head">
      <div>
        <div class="count" id="count">1 / 13</div>
        <h2 id="playerName">宗山塁</h2>
      </div>
      <a class="source" id="sourceLink" href="https://ouenka-shu.com/rui_muneyama_eagles/" target="_blank" rel="noopener">原曲・参考</a>
    </div>
    <div class="lyrics" id="lyrics"></div>
    <div class="nav">
      <button id="prev" type="button">← 前の選手</button>
      <button id="next" type="button">次の選手 →</button>
    </div>
  </section>

  <div class="selector-title">選手を選択</div>
  <nav class="roster" id="roster" aria-label="選手一覧"></nav>
  <p class="footer-note">画面をタップして選手を切り替えられます。文字サイズは右上の A− / A＋ で調整できます。iPhoneではSafariで開き、「ホーム画面に追加」すると次回からすぐに表示できます。</p>
</main>
<script>
const players = [
  { name:"宗山塁", url:"https://ouenka-shu.com/rui_muneyama_eagles/", lyrics:[
    "紡ぐ想い背に いま理想の旅路(みち)を行く",
    "強く光輝く 未来へ駆け上がれ",
    "宗山！宗山！オー 宗山！"
  ]},
  { name:"度会隆輝", url:"https://ouenka-shu.com/ryuki_watarai_baystars/", lyrics:[
    "煌めくこの空に 夢の軌道描け",
    "今この歓声 打てよ 勝利のために",
    "かっとばせー！りゅうき！"
  ]},
  { name:"松尾汐恩", url:"https://ouenka-shu.com/shion_matsuo_baystars/", lyrics:[
    "覚悟を決めて振りぬけ 打球が風を切り裂き",
    "夢運ぶ 打てよ勝利への一打",
    "かっとばせー！しおん！"
  ]},
  { name:"西川史礁", url:"https://ouenka-shu.com/mishou_nishikawa_lotte/", lyrics:[
    "さあゆけ西川史礁 オーオオー",
    "気迫見せろ この声背に 今立ち向かえ",
    "闘え西川史礁 オーオオー",
    "打ち放たれたその一打は ここに勝利呼び込む",
    "西川ヒット！× 3"
  ]},
  { name:"小島大河", url:"https://ouenka-shu.com/taiga_kojima_lions/", lyrics:[
    "扇を治め行け 流れ捌け操れ",
    "軌跡刻めそのスイングで 明日を拓け",
    "※トランペット有り→アカペラ繰り返し"
  ]},
  { name:"渡部聖弥", url:"https://ouenka-shu.com/seiya_watanabe_lions/", lyrics:[
    "[前奏]",
    "運命(さだめ)の一撃 歓喜の一打",
    "せいや！",
    "",
    "[本編]",
    "さあ立ち上がれ今 スタンド舞い上がる",
    "弾丸で切り裂く 歓喜の一打",
    "かっとばせー！せいや！"
  ]},
  { name:"佐々木泰", url:"https://ouenka-shu.com/tai_sasaki_carp/", lyrics:[
    "最高の舞台で 燦然(さんぜん)と光る",
    "君は我らのステラ 大志を持ち挑め",
    "かっとばせー！ささき！"
  ]},
  { name:"正木智也", url:"https://ouenka-shu.com/tomoya_masaki_hawks/", lyrics:[
    "狙い研ぎ澄まし 殊勲の一打を",
    "高らかに放て 正木の一振りで",
    "かっとばせー！まさき！"
  ]},
  { name:"佐々木俊輔", url:"https://ouenka-shu.com/shunsuke_sasaki_giants/", lyrics:[
    "高みを目指しどこまでも 勝利に向かって走れ",
    "佐々木今だ打てよ 誇りを胸に",
    "かっとばせー ささき"
  ]},
  { name:"山口航輝", url:"https://ouenka-shu.com/kouki_yamaguchi_lotte/", lyrics:[
    "ラララ…山口 オオオ × 2",
    "ヤマグッチ ヤマグッチ",
    "ラララ…",
    "ヤマグッチ ヤマグッチ",
    "ラララ…"
  ]},
  { name:"山縣秀", url:"https://ouenka-shu.com/shu_yamagata_fighters/", lyrics:[
    "フィールドで舞う 華麗な旋律",
    "響け未来へと 行けガタシュウ",
    "かっとばせー！やまがた！"
  ]},
  { name:"長谷川信哉", url:"https://ouenka-shu.com/shinya_hasegawa_lions/", lyrics:[
    "爽やかに⾵切る ⻘炎を⼒に変える",
    "終わりのない冒険へ挑め （吠えろ！） ⻑⾕川",
    "かっとばせー！はせがわ！"
  ]},
  { name:"竹丸和幸", url:"https://ouenka-shu.com/kazuyuki_takemaru_giants/", lyrics:[
    "左腕をしならせて 投げ込め鮮やかに",
    "揺るがぬ想いで 星を掴め",
    "GoGo Let's Go たけまる"
  ]}
];
let current = 0;
let fontSize = 1;
const $ = id => document.getElementById(id);

function render() {
  const p = players[current];
  $("count").textContent = `${current + 1} / ${players.length}`;
  $("playerName").textContent = p.name;
  $("sourceLink").href = p.url;
  $("lyrics").innerHTML = "";
  p.lyrics.forEach(line => {
    const span = document.createElement("span");
    if (line === "[前奏]" || line === "[本編]") {
      span.className = "section";
      span.textContent = line;
    } else if (line.startsWith("かっとばせ") || line.startsWith("GoGo") ||
               line.startsWith("宗山！") || line.startsWith("西川ヒット") ||
               line.startsWith("ヤマグッチ")) {
      span.className = "chant";
      span.textContent = line;
    } else {
      span.textContent = line || "\u00a0";
    }
    $("lyrics").appendChild(span);
  });
  $("lyrics").style.fontSize = `calc(clamp(25px, 7vw, 36px) * ${fontSize})`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === players.length - 1;
  document.querySelectorAll(".roster button").forEach((b, i) => {
    b.classList.toggle("active", i === current);
    b.setAttribute("aria-current", i === current ? "true" : "false");
  });
}
function selectPlayer(i) {
  current = Math.max(0, Math.min(players.length - 1, i));
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
players.forEach((p, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = p.name;
  b.addEventListener("click", () => selectPlayer(i));
  $("roster").appendChild(b);
});
$("prev").addEventListener("click", () => selectPlayer(current - 1));
$("next").addEventListener("click", () => selectPlayer(current + 1));
$("smaller").addEventListener("click", () => { fontSize = Math.max(.8, fontSize - .1); render(); });
$("larger").addEventListener("click", () => { fontSize = Math.min(1.6, fontSize + .1); render(); });
render();
</script>
</body>
</html>
